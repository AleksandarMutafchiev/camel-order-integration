quarkus.http.cors=true
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, OPTIONS, POST, PUT, DELETE, PATCH
quarkus.http.port=8080

quarkus.swagger-ui.enable=true
quarkus.swagger-ui.always-include=true

%dev.quarkus.smallrye-openapi.servers=http://localhost:8080


# Datasource H2
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa

# Hibernate
quarkus.hibernate-orm.database.generation=update

# Bean Validation
quarkus.bean-validator.fail-on-constraint-violation=true

%dev.quarkus.log.level=INFO
%prod-app.quarkus.log.level=INFO